<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Chat Bot</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 700px;
      height: 90vh;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 30px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .chat-header {
      background: #2563eb;
      color: white;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bot-icon {
      width: 42px;
      height: 42px;
      background: white;
      color: #2563eb;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
    }

    .header-text h2 {
      font-size: 18px;
    }

    .header-text p {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 3px;
    }

    /* Messages */
    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #f8fafc;
    }

    .message {
      display: flex;
      margin-bottom: 15px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message-content {
      max-width: 75%;
      padding: 12px 15px;
      border-radius: 15px;
      line-height: 1.5;
      font-size: 14px;
      word-wrap: break-word;
    }

    .message.bot .message-content {
      background: white;
      color: #1e293b;
      border: 1px solid #e2e8f0;
      border-bottom-left-radius: 4px;
    }

    .message.user .message-content {
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }

    /* Input area */
    .chat-input-area {
      padding: 15px;
      background: white;
      border-top: 1px solid #e5e7eb;
    }

    .input-wrapper {
      display: flex;
      gap: 10px;
    }

    #userInput {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 25px;
      padding: 12px 18px;
      font-size: 14px;
      outline: none;
    }

    #userInput:focus {
      border-color: #2563eb;
    }

    #sendButton {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 18px;
      transition: 0.2s;
    }

    #sendButton:hover {
      background: #1d4ed8;
      transform: scale(1.05);
    }

    #sendButton:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      transform: none;
    }

    /* Typing animation */
    .typing {
      display: flex;
      gap: 4px;
      padding: 5px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: #94a3b8;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
      }
      30% {
        transform: translateY(-5px);
      }
    }

    /* Mobile */
    @media (max-width: 600px) {
      body {
        align-items: stretch;
      }

      .chat-container {
        height: 100vh;
        border-radius: 0;
      }

      .message-content {
        max-width: 85%;
      }
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <!-- Header -->
    <div class="chat-header">
      <div class="bot-icon">🤖</div>

      <div class="header-text">
        <h2>My AI Chat Bot</h2>
        <p>Online • Ready to help</p>
      </div>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chatMessages">

      <div class="message bot">
        <div class="message-content">
          👋 Hello! I'm your chatbot. How can I help you today?
        </div>
      </div>

    </div>

    <!-- Input -->
    <div class="chat-input-area">
      <div class="input-wrapper">

        <input
          type="text"
          id="userInput"
          placeholder="Type your message..."
          autocomplete="off"
        >

        <button id="sendButton">➤</button>

      </div>
    </div>

  </div>


  <script>

    const userInput = document.getElementById("userInput");
    const sendButton = document.getElementById("sendButton");
    const chatMessages = document.getElementById("chatMessages");


    // Add a message to chat
    function addMessage(text, sender) {

      const message = document.createElement("div");

      message.className = "message " + sender;

      const content = document.createElement("div");

      content.className = "message-content";

      content.textContent = text;

      message.appendChild(content);

      chatMessages.appendChild(message);

      // Scroll to bottom
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }


    // Show typing animation
    function showTyping() {

      const message = document.createElement("div");

      message.className = "message bot";

      message.id = "typingMessage";

      message.innerHTML = `
        <div class="message-content">
          <div class="typing">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      `;

      chatMessages.appendChild(message);

      chatMessages.scrollTop = chatMessages.scrollHeight;
    }


    // Remove typing animation
    function removeTyping() {

      const typing = document.getElementById("typingMessage");

      if (typing) {
        typing.remove();
      }
    }


    // Generate bot response
    function getBotResponse(message) {

      const text = message.toLowerCase().trim();


      if (text.includes("hello") || text.includes("hi")) {
        return "Hello! 👋 Nice to meet you. How can I help?";
      }


      if (text.includes("how are you")) {
        return "I'm doing great! 🤖 Thanks for asking.";
      }


      if (text.includes("name")) {
        return "I'm My AI Chat Bot.";
      }


      if (text.includes("help")) {
        return "Sure! Tell me what you need help with.";
      }


      if (text.includes("github")) {
        return "GitHub Pages can host this chatbot as a static website.";
      }


      if (text.includes("bye")) {
        return "Goodbye! 👋 Have a great day!";
      }


      return "I received your message: \"" + message +
             "\". You can connect me to an AI API to make me smarter!";
    }


    // Send message
    function sendMessage() {

      const message = userInput.value.trim();

      if (message === "") {
        return;
      }


      // Add user message
      addMessage(message, "user");


      // Clear input
      userInput.value = "";


      // Disable button
      sendButton.disabled = true;


      // Show typing
      showTyping();


      // Simulate bot thinking
      setTimeout(() => {

        removeTyping();

        const response = getBotResponse(message);

        addMessage(response, "bot");

        sendButton.disabled = false;

        userInput.focus();

      }, 800);
    }


    // Send button
    sendButton.addEventListener("click", sendMessage);


    // Enter key
    userInput.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    });


    // Focus input when page loads
    userInput.focus();

  </script>

</body>
</html>
